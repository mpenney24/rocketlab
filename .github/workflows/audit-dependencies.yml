# Mitch - added this file instead of .github/dependabot.yml, as that feature automatically created PRs for dependency updates, whereas I want us to have
#  warnings only, so we can control of when/where we choose to update our packages (see Makefile's new "audit" command); VISIBILITY
name: Weekly Audit for EOL/Vulnerable Upsteam Dependencies

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-2025
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v7.0.1

      - name: 2. Set up .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: LaunchPad.sln

      - name: 3. Check Dependencies
        shell: pwsh
        run: |
          make restore
          make audit