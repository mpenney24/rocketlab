name: LaunchPad CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
    build-and-test:
      name: Build & Test on Windows
      runs-on: windows-latest

      steps:
        - name: 1. Checkout Code
          uses: actions/checkout@v4

        - name: 2. Set up .NET SDK
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '10.0.x'

        - name: 3. Restore Dependencies
          run: dotnet restore LaunchPad.sln

        - name: 4. Build Solution
          run: dotnet build LaunchPad.sln -c Release --no-restore /p:LP_CI_BUILD_ID=${{ github.run_number }} /p:LP_GIT_COMMIT_SHA=${{ github.sha }}

        - name: 5. Run Unit Tests
          run: dotnet test LaunchPad.sln -c Release --no-build

        - name: 6. Publish Release Binaries
          run: dotnet publish src/LaunchPad.Cli/LaunchPad.Cli.csproj -c Release -o ./publish-output --no-build /p:LP_CI_BUILD_ID=${{ github.run_number }} /p:LP_GIT_COMMIT_SHA=${{ github.sha }}

        - name: 7. Upload Build Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: LaunchPad-Windows-${{ github.run_number }}-${{ github.sha }}
            path: ./publish-output/