name: LaunchPad - GitHub Actions Basic Pipeline

# Mitch - linting should happen for the *FULL* code base on push, whereas pull_request should lint *changes only*; OOS for this task? [UPDATE: yes it's OOS]
#  ACTION: severity low, priority medium - once codebase is secure, fix this to allow smoother concurrent development
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-package:
    name: LaunchPad Basic Pipeline (Lint, Test & Package via Docker)
    # Mitch - ubuntu-latest is cheaper and quicker than windows-latest, and using containers means the project build inside is unaffected ( EDIT THIS)
    runs-on: windows-2025
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build, Test, and Export Binaries (Cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          # Mitch - GitHub Actions cache backend persists Windows layers between runs, as the Docker image is quite large and downloads 1.5gb each time!
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=local,dest=./publish-output
          # Mitch - passing metadata into projects to be built with tracing
          build-args: |
            LP_CI_BUILD_ID=${{ github.run_number }}
            LP_GIT_COMMIT_SHA=${{ github.sha }}

      - name: 4. Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
        # Mitch - apply tracing to produced binary names too
          name: LaunchPad-${{ github.run_number }}-${{ github.sha }}
          path: ./publish-output/