# Mitch - this version of the ci pipeline is one that uses Docker to build the artifacts, moving implementation directly into the container
#  while the GitHub Actions runner orchestrates it; PORTABILITY

# see "ci.yml" for explanations of the boilterplate below

name: LaunchPad CI - Docker

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
    build-and-test:
      name: Build & Test on Windows - Docker version
      runs-on: windows-2025

      steps:
        - name: 0. Generate Env Vars
          shell: pwsh
          run: |
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            echo "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV

        - name: 1. Checkout Code
          uses: actions/checkout@v7.0.1

        # Mitch - because of Docker, any changes are made in the Dockerfile alone, and this pipeline can likely sit here untouched,
        #  as it's only purpose is to orchestrate the build; CONTAINERISTATION
        - name: 2. Build Docker Image
          run: |
            docker build `
              --build-arg LP_CI_BUILD_ID=${{ github.run_number }} `
              --build-arg LP_GIT_COMMIT_SHA=${{ env.SHORT_SHA }} `
              --build-arg LP_GIT_BRANCH_NAME=${{ env.BRANCH_NAME }} `
              -t launchpad-ci-docker:${{ env.BRANCH_NAME }}-${{ github.run_number }}-${{ env.SHORT_SHA }} .

        - name: 3. Extract Binaries from Docker
          run: |
            docker create --name temp-ext launchpad-ci-docker:${{ env.BRANCH_NAME }}-${{ github.run_number }}-${{ env.SHORT_SHA }}
            New-Item -ItemType Directory -Force -Path .\artifacts
            docker cp temp-ext:/app/out .\artifacts
            docker rm temp-ext

        - name: 4. Upload Build Artifacts
          uses: actions/upload-artifact@v7.0.0
          with:
            name: LaunchPad-Docker-LP_GIT_BRANCH_NAME-${{ env.BRANCH_NAME }}-LP_CI_BUILD_ID-${{ github.run_number }}-LP_GIT_COMMIT_SHA-${{ env.SHORT_SHA }}
            path: artifacts/