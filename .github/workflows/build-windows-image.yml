name: Build Windows 2025 Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: windows-2025
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RL_IMAGE_TOKEN }}

      - name: 1. Build and Push Windows Image
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          $image = "ghcr.io/$owner/rl-win2025-image"
          $shaTag = "${image}:${{ github.sha }}"
          $latestTag = "${image}:latest"

          docker build -t $shaTag -t $latestTag .
          docker push $shaTag
          docker push $latestTag
